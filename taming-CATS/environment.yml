# 研究室サーバー（CUDA GPU）向け conda 環境。
# 各自 `conda env create -f environment.yml` で仮想環境を構築して実験を回す。
# 設計方針（demo-mnist と同じ流儀）:
#   - conda-forge ベースで CUDA(cuda-toolkit) と PyTorch を env に同梱（システム CUDA に依存しない）
#   - HF スタックと評価系ライブラリは pip で導入
name: wada-yuto
channels:
  - conda-forge
dependencies:
  - python=3.12
  - cuda-toolkit=13.2        # 研究室 GPU/ドライバに合わせて調整
  - pytorch                  # conda-forge の GPU ビルド。固定するなら例: pytorch=2.9.1=cuda129_*
  - ipykernel
  - numpy
  - pandas
  - matplotlib
  - scikit-learn
  - sentencepiece
  - protobuf
  - pyyaml
  - python-dotenv
  - tqdm
  - pip
  - pip:
      # --- HF スタック（学習・推論の本体）。著者版に pin（transformers 5.x は API 非互換）---
      - transformers==4.48.3
      - tokenizers==0.21.0
      - datasets==3.3.0
      - accelerate==1.12.0
      - huggingface-hub
      - safetensors
      # --- 評価・可読性指標（Metrics.py / sft_eval.py が使用） ---
      - sacrebleu
      - sacremoses     # evaluate の SARI が要求
      - rouge-score
      - bert-score
      - evaluate
      - nltk
      - textstat
      - lens-metric    # LENS 評価（Metrics.compute_lens が使用。初回は davidheineman/lens を DL）
      - seaborn        # sft_eval.py の可視化で使用
      # --- ロギング ---
      - wandb
      # --- 学習コードが無条件 import するため必須（フルFTでも要る） ---
      - peft
      - bitsandbytes    # CUDA 前提。GPU サーバーで導入
      # --- 用途に応じて有効化 ---
      # - vllm            # 推論高速化 --use_vllm を使うとき
      # - optuna          # ハイパラ探索（sweep）を使うとき
