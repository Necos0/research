method: grid  # "bayes", "random", "grid"

metric:
  name: eval_loss
  goal: minimize

parameters:
  learning_rate:
    values: [1e-5, 5e-5, 1e-4, 2e-4]
  lora_r:
    values: [4,8,16]
  lora_dropout:
    values: [0.05, 0.1]
  max_grad_norm:
    values: [0.5, 1.0]
  

command:
  - ${env}
  - python
  - src/sft_finetune.py
  - --model_class=llama
  - --model_family=base
  - --model_name=meta-llama/Llama-2-13b-chat-hf
  - --dataset_name=Med-EASi_hq
  - --metric_name=FKGL
  - --epochs=3
  - --batch_size=4
  - --max_length=512
  - --warmup_steps=30
  - --weight_decay=0.01
  - --gradient_accumulation_steps=4
  - --user_prompt_id=token_explanation
  - --wandb_project_name=thesis-SFT
  - --wandb_entity=shtosti
  - --control_tokens=data/prompts/control_tokens.json
  - --system_prompts=data/prompts/system_prompts.json
  - --user_prompts=data/prompts/user_prompts.json
  - --metric_mapping=data/metric_mapping.json
  - --peft
  - ${args}
